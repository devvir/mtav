# Actions and the release image's base images are pinned to exact commits and digests: this
# proposes the new ones, to dev like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /deploy
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ['*']
