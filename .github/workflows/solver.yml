# GLPK on hard instances (tests/Stress), when what they check changes. Apart from the pipeline:
# they measure time, and a slow runner should not hold a release back.
name: solver

on:
  push:
    branches: ['**']
    paths:
      - app/Services/Lottery/Solvers/**
      - config/lottery.php
      - tests/Stress/**
      - tests/Datasets/**
      - .github/workflows/solver.yml
  workflow_dispatch:

concurrency:
  group: solver-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stress:
    name: Solver on hard instances
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stress suite (Pest)
        run: ./mtav pest --testsuite Stress
