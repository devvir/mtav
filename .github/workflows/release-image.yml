# The release image of a commit (deploy/Dockerfile): built, and published to GitHub's
# registry as ghcr.io/devvir/mtav:sha-<commit> when asked. Used by the pipeline (every
# push) and by dev deploys (any branch).
name: release image

on:
  workflow_call:
    inputs:
      publish:
        description: Publish the image (else it is only built)
        type: boolean
        default: false
      latest:
        description: Also tag it as main
        type: boolean
        default: false
    outputs:
      image:
        description: The image, by commit tag
        value: ${{ jobs.image.outputs.image }}

jobs:
  image:
    name: Release image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    env:
      IMAGE: ghcr.io/devvir/mtav
    steps:
      - name: Name
        id: name
        run: echo "image=$IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A commit already published (staging's, deployed to dev) is not built again
      - name: Already published?
        id: published
        if: inputs.publish && !inputs.latest
        run: |
          if docker manifest inspect "${{ steps.name.outputs.image }}" > /dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.published.outputs.yes != 'true'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.published.outputs.yes != 'true'

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.published.outputs.yes != 'true'
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ inputs.publish }}
          tags: |
            ${{ steps.name.outputs.image }}
            ${{ inputs.latest && format('{0}:main', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # The build cache lives beside the images (uploading to GitHub's Actions cache took
          # longer than the build). Any branch reads it; only main's publishing builds write
          # it, so a branch can never plant layers that main's releases then reuse
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ inputs.publish && github.ref == 'refs/heads/main' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}
