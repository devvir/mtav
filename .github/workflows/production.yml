# The released environments are deployed by hand, from main only: "Run workflow" on main.
# Production, or sorteo (the Open Lottery variant), each gets the release staging runs
# (already tried there), or a commit named, which must be on main.
name: production
run-name: Deploy ${{ inputs.environment || 'production' }}${{ inputs.commit && format(' at {0}', inputs.commit) || '' }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [production, sorteo]
        default: production
      commit:
        description: Commit to deploy (empty for the one staging runs)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  production:
    if: github.ref == 'refs/heads/main'
    name: Deploy to ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment || 'production' }}
      # After the # the release that went live, for the console: the run itself is on main
      url: ${{ inputs.environment == 'sorteo' && 'https://sorteo.mtav.uy' || 'https://www.mtav.uy' }}/#${{ steps.release.outputs.commit }}
    concurrency:
      group: deploy-${{ inputs.environment || 'production' }}
      cancel-in-progress: false
    env:
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      TARGET: ${{ secrets.DEPLOY_TARGET }}
      REQUESTED: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Which release
        id: release
        run: |
          staging="$(deploy/ci/deploy status | sed -nE 's/^staging live=[a-z]+:ghcr\.io\/devvir\/mtav:sha-([0-9a-f]{40}).*/\1/p')"
          commit="$(git rev-parse --verify "${REQUESTED:-${staging:?staging runs no release yet: name a commit}}^{commit}")"
          git merge-base --is-ancestor "$commit" origin/main || { echo "$commit is not on main"; exit 1; }
          git merge-base --is-ancestor "$commit" origin/staging || { echo "$commit never went through staging"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Deploy
        run: deploy/ci/deploy deploy "${{ inputs.environment || 'production' }}" "${{ steps.release.outputs.commit }}"
