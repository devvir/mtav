# Puts the release before the live one back, at once (it stays up, idle, after each
# deploy). Its database keeps the newer release's migrations.
name: rollback
run-name: Roll back ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to put back
        type: choice
        options: [staging, dev, production]

permissions:
  contents: read

jobs:
  rollback:
    name: Roll back ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy/ci

      - name: Roll back
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_TARGET }}
        run: deploy/ci/deploy rollback "${{ inputs.environment }}"
