# Dev runs the `dev` branch: every push to it deploys it. By hand, any other branch:
# "Run workflow", then pick the branch. The branch's release image is built if it is not
# published yet; no tests gate it: dev is where branches are tried, so every deploy starts
# over from the demo data.
name: dev
run-name: Deploy dev from ${{ github.ref_name }}

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-image.yml
    with:
      publish: true

  dev:
    needs: image
    name: Deploy to dev
    runs-on: ubuntu-24.04
    environment:
      name: dev
      url: https://dev.mtav.uy
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: deploy/ci

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_TARGET }}
        run: deploy/ci/deploy deploy dev "$GITHUB_SHA" fresh
