# Dev runs the `dev` branch: every push to it deploys it. By hand, any other branch:
# "Run workflow", then pick the branch. The branch's release image is built if it is not
# published yet; no tests gate it: dev is where branches are tried, so every deploy starts
# over from the demo data. What any branch publishes reaches dev alone: staging deploys only
# what its own run built, and production only images attested as staging's or main's.
name: dev
run-name: Deploy dev from ${{ github.ref_name }}

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-image.yml
    with:
      publish: true

  dev:
    needs: image
    name: Deploy to dev
    runs-on: ubuntu-24.04
    environment:
      name: dev
      url: https://dev.mtav.uy
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy/ci

      - name: Deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: deploy/ci/deploy deploy dev "$GITHUB_SHA" "$DIGEST" fresh
