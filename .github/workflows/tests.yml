name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Make `mtav` executable
        run: chmod +x ./mtav

      # `mtav pest` / `mtav vitest` each boot the isolated mtav-testing
      # compose project (docker/testing/), run, and tear down.
      # All images build locally — no registry login required.
      - name: PHP tests (Pest)
        run: ./mtav pest

      - name: Vue tests (Vitest)
        run: ./mtav vitest

      # The E2E journey suite (mtav e2e) is the deliberate pre-deployment
      # safety net, not a per-push gate — run it manually before deploying.
      # Uncomment to gate CI on it as well (adds the ~2.5GB e2e image build):
      # - name: E2E journeys (Playwright)
      #   run: ./mtav e2e

      - name: Collect compose logs (best effort — env may already be down)
        if: always()
        run: |
          ./mtav compose testing logs --no-color --tail 200 php > ci-php-logs.txt || true
          ./mtav compose testing logs --no-color --tail 200 assets > ci-assets-logs.txt || true
          docker ps -a > ci-docker-ps.txt || true

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-container-logs
          path: |
            ci-php-logs.txt
            ci-assets-logs.txt
            ci-docker-ps.txt

      - name: Tear down testing environment
        if: always()
        run: ./mtav compose testing down --volumes --remove-orphans || true
