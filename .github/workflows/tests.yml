name: tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  # Every push: the business rules (Pest use cases), the lottery solvers, frontend logic.
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # `mtav pest` / `mtav vitest` each boot the isolated mtav-testing compose
      # project (docker/testing/), run, and tear down. Images build locally.
      - name: PHP tests (Arch, Unit, UseCases)
        run: ./mtav pest

      - name: Vue tests (Vitest)
        run: ./mtav vitest

      - name: Collect logs
        if: failure()
        run: ./mtav compose testing logs --no-color --tail 300 > ci-testing-logs.txt || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testing-logs
          path: ci-testing-logs.txt

  # Before merging (and on demand): the whole browser suite — every page of the three
  # areas, every feature's edge cases, phones, Spanish, accessibility. Takes minutes.
  e2e:
    needs: checks
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Browser tests (Playwright)
        run: ./mtav e2e

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/Browser/Screenshots
