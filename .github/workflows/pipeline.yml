# MTAV's pipeline (documentation/technical/delivery.md):
#
#   every push and pull request   checks, tests, browser suite, the release image built
#   staging, once all that passes the image published and attested, staging deployed (by digest)
#   main, once all that passes    the image published and attested (production is deployed by hand)
#
# Dev deploys from its own branch (dev.yml), and by hand from any other.
name: pipeline

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release image (main and staging always do)
        type: boolean
        default: false

concurrency:
  group: pipeline-${{ github.ref }}
  # A newer push supersedes a run in progress, except where every commit is released
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

permissions:
  contents: read

jobs:
  # Pushes to this repository run on push; pull requests run only when they come from forks
  # (their branches' pushes already ran here)
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Style, lint and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
          cache: pnpm

      - name: Install
        run: |
          composer install --no-interaction --no-progress --no-scripts --prefer-dist
          pnpm install --frozen-lockfile

      - name: PHP style
        run: vendor/bin/pint --test

      - name: PHP static analysis
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Frontend lint
        run: pnpm run lint:check

      - name: Frontend formatting
        run: pnpm run format:check

      - name: Frontend types
        run: pnpm run typecheck

  tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same isolated environment as on a developer's machine (docker/testing)
      # One process per core, each with a database of its own
      - name: Business rules and lottery (Pest)
        run: ./mtav pest --parallel

      - name: Frontend logic (Vitest)
        run: ./mtav vitest

      - name: Logs
        if: failure()
        run: ./mtav compose testing logs --no-color --tail 300 > testing-logs.txt || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: testing-logs
          path: testing-logs.txt

  # The slowest job, split by test file across runners that run at once, each with its own
  # app and database: the suite takes the time of its longest part
  browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Browser suite (${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      # Every part runs to the end: one failing says nothing of the others
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every page, form and journey in a real browser (docker/e2e)
        run: ./mtav e2e --shard=${{ matrix.shard }}/3

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-screenshots-${{ matrix.shard }}
          path: tests/Browser/Screenshots

      # Every route this part made the app serve (tests/Browser/Support/RoutesSeen.php): what no journey reaches
      # shows against the app's routes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-routes-${{ matrix.shard }}
          path: storage/logs/e2e-routes.log
          retention-days: 14
          if-no-files-found: ignore

  image:
    needs: [checks, tests, browser]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-image.yml
    with:
      publish: ${{ (github.event_name == 'push' && contains(fromJSON('["refs/heads/main", "refs/heads/staging"]'), github.ref)) || inputs.publish == true }}
      latest: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

  # GitHub's signed word that this digest was built here, by this workflow, from this commit, on
  # staging or main: what a production deploy checks before running an image (production.yml).
  # Only these branches' runs can say it of themselves
  attest:
    needs: image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    name: Attest the release image
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/devvir/mtav
          subject-digest: ${{ needs.image.outputs.digest }}
          create-storage-record: false

  # main moves only by fast-forward from staging: a commit staging never had is refused here
  # (and production deploys only commits that are on staging too)
  main-follows-staging:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    name: main follows staging
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The commit is on staging
        run: |
          git fetch --quiet origin staging
          git merge-base --is-ancestor "$GITHUB_SHA" origin/staging \
            || { echo "::error::main moves only by fast-forward from staging"; exit 1; }

  # Every green push to staging goes there, by itself: the image this run built, by its digest
  staging:
    needs: [image, attest]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    name: Deploy to staging
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: https://stg.mtav.uy
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy/ci

      - name: Deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: deploy/ci/deploy deploy staging "$GITHUB_SHA" "$DIGEST"
