# Development Environment
#
# Daily-driver setup: bind-mounted code, Vite HMR, persistent database,
# mail sink. Isolated as Docker Compose project "mtav-dev".
#
# Ports and env come from .env in this directory (layered on the root .env
# by the mtav CLI, with optional personal overrides in .env.local).

name: mtav-dev

include:
  - ../services/nginx/compose.yml
  - ../services/mysql/compose.yml
  - ../services/assets/compose.yml
  - ../services/mailpit/compose.yml

services:
  # Jobs wait their time (a lottery's reveal) and run apart, in the worker, as on a
  # server; the root .env's queue (the tests' too) stays as it is
  php:
    extends:
      file: ../services/php/compose.yml
      service: php
    environment:
      QUEUE_CONNECTION: database

  # Works the queue as on a server (deploy/slot.yml): a lottery run, the reveal it waits
  # for, mail. queue:work, as there (it marks that it runs: queue:listen never does, and
  # the lottery would wait for it); it takes PHP edits on restart (./mtav compose dev
  # restart worker).
  worker:
    extends:
      file: ../services/php/compose.yml
      service: php
    command: php artisan queue:work --tries=3 --timeout=600
    environment:
      QUEUE_CONNECTION: database
      # The Assistant, on this machine's signed-in Claude account (the volume the machine's agent
      # accounts live in): no key involved, and no such account on any server
      ASSISTANT_DRIVER: ${ASSISTANT_DRIVER:-cli}
      ASSISTANT_CLI_HOME: /claude-accounts/${ASSISTANT_ACCOUNT:-bindart}
    volumes:
      - claude-accounts:/claude-accounts
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy

  # Reverb touches the database at boot, so unlike php-fpm (which only
  # connects per-request) it needs mysql up before starting.
  reverb:
    extends:
      file: ../services/reverb/compose.yml
      service: reverb
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  claude-accounts:
    name: claude-accounts
