# Assets development server (Vite w/HMR, pnpm).
#
# The pnpm store lands in <repo>/.pnpm-store (gitignored): pnpm can't hardlink
# from the bind-mounted project to another filesystem, so it keeps the store
# project-local — which also makes installs fast across container recreations.
#
# VITE_PORT empty ⇒ random host port.
services:
  assets:
    build:
      context: ../../..
      dockerfile: docker/services/assets/dev.Dockerfile
    restart: unless-stopped
    ports:
      - "${VITE_PORT:-}:5173"
    volumes:
      - ../../..:/var/www/html:cached
    environment:
      CHOKIDAR_USEPOLLING: "true"
