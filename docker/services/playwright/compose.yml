# Playwright server for browser (E2E) testing.
# Pest connects to it at playwright:5000 (see tests/Pest.php).
#
# The CLI version MUST match the image tag (the image ships that version's
# browser builds), so both derive from PLAYWRIGHT_VERSION. Keep it compatible
# with @playwright/test in package.json and pest-plugin-browser's requirement.
services:
  playwright:
    image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION:-1.57.0}-noble
    command: npx -y playwright@${PLAYWRIGHT_VERSION:-1.57.0} run-server --host 0.0.0.0 --port 5000
    restart: unless-stopped
