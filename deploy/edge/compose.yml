# The host's front door: Caddy takes every request on 80 and 443, gets and renews the
# TLS certificates, and hands each domain to its environment over the mtav-edge network.
# Set up once per host (documentation/technical/delivery.md); environments come and go
# behind it.

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - config:/config
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

volumes:
  certificates:
  config:

networks:
  edge:
    name: mtav-edge
