# One MTAV environment (staging, production…) on a host: what stays while releases come
# and go. Run as the compose project mtav-<environment> from the environment's directory,
# whose .env holds its settings and secrets (deploy/env.example).
#
# Releases run in one of two slots (deploy/slot.yml, projects mtav-<environment>-blue and
# -green). The switch is the environment's front door: the host's proxy reaches it on
# MTAV_WEB_PORT (pages) and MTAV_WS_PORT (the websocket server), on the host's loopback
# only, and it hands both to the slot that is live (deploy/switch/live.conf.template).

services:
  switch:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MTAV_WEB_PORT:?}:8080'
      - '127.0.0.1:${MTAV_WS_PORT:?}:8081'
    volumes:
      - ./switch:/etc/nginx/conf.d:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/switch']
      interval: 10s
      timeout: 5s
      retries: 3
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  db:
    image: mariadb:12.3
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?}
      MARIADB_USER: ${DB_USERNAME:?}
      MARIADB_PASSWORD: ${DB_PASSWORD:?}
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
      start_interval: 2s
    logging: *logging

volumes:
  # The database: what a release never replaces. Uploaded files (media, documents,
  # avatars) are the other, mtav-<environment>_files, which the deploy makes for both
  # slots to share.
  database:

networks:
  default:
    name: mtav-${MTAV_ENV:?}
