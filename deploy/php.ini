; PHP in the release image

; Code never changes inside a running container
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0

; Errors go to the log, never to the page
display_errors=Off
display_startup_errors=Off
log_errors=On
expose_php=Off

session.cookie_httponly=1
session.cookie_secure=1
session.use_only_cookies=1
; Mitigates CVE-2026-115560 (no release fixes it yet); the app never reports upload progress
session.upload_progress.enabled=0

memory_limit=512M
max_execution_time=60
max_input_time=60

; Media uploads: up to 100 MB per file
post_max_size=105M
upload_max_filesize=100M

date.timezone=UTC
